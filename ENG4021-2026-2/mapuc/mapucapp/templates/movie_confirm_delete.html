{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumière</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="header"><span>Lumière</span></div>
    <main style="padding: 1rem; max-width: 600px;">
        <h1>Deletar filme</h1>
        <p>Tem certeza que deseja deletar <strong>{{ movie.title }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Confirmar</button>
            <a href="{% url 'home' %}" class="btn">Cancelar</a>
        </form>
    </main>
</body>
</html>
